name: Yizhan
version: '${project.version}'
main: com.azadkuu.yizhan.YizhanPlugin
api-version: '1.21.3'
authors: [AZADKUU]
description: Cross-server item transport relay for Paper
commands:
  yizhan:
    description: Yizhan main command
    usage: /yizhan help
    aliases: [yz, yizhanstation]
  video:
    description: Make a one-time video card (or send one to another player)
    usage: /video [player] <url>
    aliases: [v]
permissions:
  yizhan.bind:
    description: Bind or unbind stations
    default: op
  yizhan.route:
    description: Manage routes and buffer time
    default: op
  yizhan.open:
    description: Open station containers
    default: true
  yizhan.mail:
    description: Open own mailbox by right-clicking the mailbox block
    default: true
  yizhan.mail.send:
    description: Send items or rewards to another player's mailbox
    default: op
  yizhan.admin:
    description: Reload and administrative actions
    default: op
  yizhan.video:
    description: Make one-time video cards and send them to other players
    default: true
