server-id: "survival-1"
debug: false
poll-interval-seconds: 3
default-buffer-seconds: 300
allow-cancel-shipment: false
default-station-size: 27
max-station-size: 45
language:
  prefix: "&8[&6驿站&8] &r"
messages:
  ship-start: "&a发货成功啦！包裹 &7#%id% &a飞往 &f%to% &a，预计 &f%buffer% &a后抵达"
  ship-arrived: "&a包裹 &7#%id% &a到啦！放在 &f%station% &a的收件箱里，快来领走吧！"
  ship-waiting: "&e目标驿站 &f%station% &e塞满啦，包裹 &7#%id% &e正在排队等空位，催催对方清一清收件箱吧！"
  ship-discarded: "&c目标驿站 &f%station% &c塞满超过 &f%hours% &c小时，包裹 &7#%id% &c投不进去，已暂存，快找管理员领取吧！"
  mail-received: "&a邮箱收到新东西啦：&f%amount% &a个 &f%item%"
  mail-received-from: "&a邮箱收到新东西啦：&f%amount% &a个 &f%item%&a，来自 &f%sender%"
  mail-sent: "&a已把 &f%amount% &a个 &f%item% &a塞进 &f%target% &a的邮箱啦！"
  item-blocked: " &c本站不收这个！"
  item-blocked-in-send: "&c发货区里有禁运物品 &f%item% &c，本站不收这个！"
  ship-empty: "&7发货区空空的，先放点东西进去呀！"
  no-route: "&c这里还没配发货线路，找管理员开通一下吧！"
  ship-failed: "&c呜，发货失败了，稍后再试试？"
  station-not-found: "&c目的地驿站 &f%station% &c不存在，是不是走错门了？"
  station-capacity-exceeded: "&c目标驿站 &f%station% &c装不下啦：只剩 &f%free% &c格，这次要放 &f%need% &c格（收件箱已用 &f%used% &c，在途 &f%pending% &c）。先让对方清一清收件箱吧！"
  claim-success: "&a到手 &f%amount% &a组物品！"
  mailbox-empty: "&7邮箱空空的，啥也没有"
  claim-failed: "&c领取失败了，稍后再试试？"
  receive-only: "&c收件箱只能往外拿，不能往里放哦！"
  fee-slot-occupied: "&7快递费槽里已有东西，先拿出来吧"
  fee-insufficient: "&c快递费不够呀，需要 &f%need% &c个，你才放了 &f%have% &c个"
  route-single: "&7就这么一条线路，没得切换"
  route-switched: "&7目的地切到 &f%station% &7啦！"
  reclaim-failed: "&c重新领取失败了，稍后再试试？"
  reclaim-success: "&a补入 &f%amount% &a件邮件！"
  reclaim-pending: "&7，还有 &f%pending% &7件在排队（邮箱满了）"
  reclaim-none: "&7没有可补的邮件，先腾点邮箱空位吧"
  save-conflict: "&c收件箱被别的地方改动过啦，这次改的没存上"
  save-failed: "&c收件箱保存失败了！"
  no-permission: "&c你没有权限哦！"
  player-only: "&c只有玩家才能用这条指令"
  station-not-exist: "&c驿站 &f%station% &c不存在，是不是记错名字了？"
  station-exists: "&c驿站 &f%station% &c早就有了，换个名字吧"
  no-item-in-hand: "&c手上空空如也，先拿个物品嘛"
  amount-invalid: "&c数量得是整数才行"
  amount-positive: "&c数量得大于 0 啊"
  player-not-found: "&c找不到玩家 &f%player% &c（用玩家名或 UUID；从没进过服的请用 UUID）"
  item-invalid: "&c不认这个物品或代号: &f%item%"
  config-reloaded: "&a配置重新加载好啦！"
database:
  host: "127.0.0.1"
  port: 3306
  database: "yizhan"
  user: "root"
  password: "change_me"
  table-prefix: "yz_"
  pool-size: 6
  use-ssl: false
  connection-timeout-ms: 10000
item-filter:
  blocked-namespaces:
    - "nexo"
    - "itemsadder"
    - "ia"
  blocked-keys: []
  # 白名单：优先级高于黑名单，命中即放行。可精确到某个自定义物品。
  # key 为 NBT/PDC 键，value 为对应值（用 /yz debugitem 查看物品的键值对）。
  # 示例：
  # allowed-items:
  #   - key: "nexo:item_id"
  #     value: "coin"
  allowed-items: []
  blocked-materials: []          # 原版物品黑名单，按材质名，例如 ["paper","diamond_sword"]，可带 minecraft: 前缀
  block-custom-model-data: false
mailbox:
  size: 45                       # 每个玩家独立邮箱的容量（9-45，会向上取整到整行）
daily-reward:
  enabled: false                 # 每天首次登录时自动投递到玩家邮箱（离线期间不补发）
  message: "&a每日奖励到账啦！已经放进你的邮箱咯"
  # 原版物品奖励：按材质名配置。自定义物品（Nexo/ItemsAdder）无法用材质名描述，
  # 请用 /yz dailyreward add 手持物品登记，两种来源的奖励会叠加发放。
  # 示例：
  # items:
  #   - material: "diamond"
  #     amount: 1
  items: []
ship-fee:
  # 货币的显示名称，用于各种提示消息中（如"需要 3 个 NIJIJOJI币"）
  currency-name: "货币物品"
  # 快递费货币的识别键：物品的 PDC / custom_data 键名包含它即视为货币
  currency-key: "currency"
  # 货币的值：留空表示只按键名判定（任何带该键的物品都算货币）；
  # 填写后必须键和值都匹配（Nexo 物品共用键名、靠值区分，此时必须填值）。
  # 用 /yz debugitem 查看手持货币物品的实际键值。
  currency-value: ""
shipment:
  # 目标驿站满时一直重试投递；超过该小时数仍投不进，包裹物品暂存到丢弃仓库（管理员用 /yz discarded 领取）
  discard-after-hours: 24
