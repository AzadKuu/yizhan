server-id: "survival-1"
debug: false
poll-interval-seconds: 3
default-buffer-seconds: 300
allow-cancel-shipment: false
default-station-size: 27
max-station-size: 45
language:
  prefix: "&8[&6驿站&8] &r"
messages:
  ship-start: "&a发货成功 &7#%id% &7目的地 &f%to% &7预计 &f%buffer%&7后到达"
  ship-arrived: "&a你的包裹 &7#%id% &a已到达 &f%station% &a，请前往领取"
  ship-waiting: "&e目标驿站 &f%station% &e已满，包裹 &7#%id% &e正在等待空位，请提醒接收方清理收件箱"
  ship-discarded: "&c目标驿站 &f%station% &c已满超过 &f%hours% &c小时，包裹 &7#%id% &c投递失败已暂存，请联系管理员领取"
  mail-received: "&a你收到了邮件: &f%amount% &a个 &f%item%"
  mail-received-from: "&a你收到了邮件: &f%amount% &a个 &f%item%&a，来自 &f%sender%"
  mail-sent: "&a已发送 &f%amount% &a个 &f%item% &a到 &f%target% &a的邮箱"
  item-blocked: " &c被识别为禁运物品，禁止运输"
  item-blocked-in-send: "&c发货区存在禁运物品 &f%item% &c，已阻止发货"
  ship-empty: "&7发货区是空的"
  no-route: "&c本站未配置路由，无法发货"
  ship-failed: "&c发货失败，请稍后重试"
  station-not-found: "&c目的地驿站 &f%station% &c不存在"
  station-capacity-exceeded: "&c目标驿站 &f%station% &c容量不足：剩余 &f%free% &c格，本次需要 &f%need% &c格（收件箱已用 &f%used% &c，在途 &f%pending% &c）。请先清理目标驿站收件箱"
  claim-success: "&a已领取 &f%amount% &a组物品"
  mailbox-empty: "&7邮箱是空的"
  claim-failed: "&c领取失败，请稍后重试"
  receive-only: "&c收件箱只能取出，不能放入"
  fee-slot-occupied: "&7快递费槽已有物品，请先取出"
  fee-insufficient: "&c快递费不足，需要 &f%need% &c个，当前只有 &f%have% &c个"
  route-single: "&7当前只有一个可用路由"
  route-switched: "&7当前目的地已切换为 &f%station%"
  reclaim-failed: "&c重新领取失败，请稍后重试"
  reclaim-success: "&a已补入 &f%amount% &a件邮件"
  reclaim-pending: "&7，仍有 &f%pending% &7件待领取（邮箱已满）"
  reclaim-none: "&7没有可补入的邮件，请先清出邮箱空位"
  save-conflict: "&c收件箱内容已被其他操作更新，本次更改未保存"
  save-failed: "&c保存收件箱失败"
  no-permission: "&c没有权限"
  player-only: "&c该命令只能由玩家执行"
  station-not-exist: "&c驿站 &f%station% &c不存在"
  station-exists: "&c驿站 &f%station% &c已存在"
  no-item-in-hand: "&c主手没有物品"
  amount-invalid: "&c数量必须是整数"
  amount-positive: "&c数量必须大于 0"
  player-not-found: "&c找不到玩家 &f%player% &c（可用玩家名或 UUID；从未进服的玩家请用 UUID）"
  item-invalid: "&c无效的物品ID或代号: &f%item%"
  config-reloaded: "&a配置已重载"
database:
  host: "127.0.0.1"
  port: 3306
  database: "yizhan"
  user: "root"
  password: "change_me"
  table-prefix: "yz_"
  pool-size: 6
  use-ssl: false
  connection-timeout-ms: 10000
item-filter:
  blocked-namespaces:
    - "nexo"
    - "itemsadder"
    - "ia"
  blocked-keys: []
  # 白名单：优先级高于黑名单，命中即放行。可精确到某个自定义物品。
  # key 为 NBT/PDC 键，value 为对应值（用 /yz debugitem 查看物品的键值对）。
  # 示例：
  # allowed-items:
  #   - key: "nexo:item_id"
  #     value: "coin"
  allowed-items: []
  blocked-materials: []          # 原版物品黑名单，按材质名，例如 ["paper","diamond_sword"]，可带 minecraft: 前缀
  block-custom-model-data: false
mailbox:
  size: 45                       # 每个玩家独立邮箱的容量（9-45，会向上取整到整行）
daily-reward:
  enabled: false                 # 每天首次登录时自动投递到玩家邮箱（离线期间不补发）
  message: "&a每日奖励已发放到你的邮箱"
  # 原版物品奖励：按材质名配置。自定义物品（Nexo/ItemsAdder）无法用材质名描述，
  # 请用 /yz dailyreward add 手持物品登记，两种来源的奖励会叠加发放。
  # 示例：
  # items:
  #   - material: "diamond"
  #     amount: 1
  items: []
ship-fee:
  # 货币的显示名称，用于各种提示消息中（如"需要 3 个 NIJIJOJI币"）
  currency-name: "货币物品"
  # 快递费货币的识别键：物品的 PDC / custom_data 键名包含它即视为货币
  currency-key: "currency"
  # 货币的值：留空表示只按键名判定（任何带该键的物品都算货币）；
  # 填写后必须键和值都匹配（Nexo 物品共用键名、靠值区分，此时必须填值）。
  # 用 /yz debugitem 查看手持货币物品的实际键值。
  currency-value: ""
shipment:
  # 目标驿站满时一直重试投递；超过该小时数仍投不进，包裹物品暂存到丢弃仓库（管理员用 /yz discarded 领取）
  discard-after-hours: 24
